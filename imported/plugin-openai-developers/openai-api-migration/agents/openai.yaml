interface:
  display_name: "OpenAI API Migration"
  short_description: "Migrate legacy OpenAI and provider integrations safely"
  default_prompt: "Use $openai-api-migration to audit this repository's provider, harness, API, model, tools, state, and streaming behavior; fetch current OpenAI documentation; produce a migration ledger; then implement and validate the agreed behavior-preserving migration."
dependencies:
  tools:
    - type: "mcp"
      value: "openaiDeveloperDocs"
      description: "OpenAI developer docs MCP server for current API and migration guidance"
      transport: "streamable_http"
      url: "https://developers.openai.com/mcp"
policy:
  allow_implicit_invocation: true
